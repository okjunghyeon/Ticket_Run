spring:
  datasource:
    url: jdbc:h2:mem:ticketrun;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

auth:
  oauth2:
    # 로그인 성공·실패 후 이동할 프론트엔드 주소
    redirect-uri: http://localhost:3000/oauth/callback
  cors:
    allowed-origins: http://localhost:3000
