server:
  port: 8080

spring:
  application:
    name: whatToEat
    version: 1.0

  profiles:
    active: dev
    include: secret

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  security:
    oauth2:
      client:
        # client-id, client-secret 은 application-secret.yml 에서 주입한다.
        registration:
          kakao:
            client-name: Kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # account_email 은 비즈 앱에서만 요청할 수 있다. 콘솔 동의항목에 없는 scope 를 요청하면 로그인이 실패한다.
            scope:
              - profile_nickname
              - profile_image
              - account_email
          google:
            # openid 가 있으면 OIDC 흐름이 되어 CustomOidcUserService 가 사용자 정보를 처리한다.
            scope:
              - openid
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

auth:
  jwt:
    access-token-expiration: 30m
    refresh-token-expiration: 14d

kakao:
  local:
    # rest-api-key 는 application-secret.yml 에서 주입한다.
    base-url: https://dapi.kakao.com
