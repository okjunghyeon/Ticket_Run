spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  # CI 에는 application-secret.yml 이 없으므로 컨텍스트 로딩용 더미 값을 둔다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

auth:
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGlja2V0cnVuLTMyYnl0ZXM=
  oauth2:
    redirect-uri: http://localhost:3000/oauth/callback
  cors:
    allowed-origins: http://localhost:3000

kakao:
  local:
    rest-api-key: test-kakao-rest-api-key
