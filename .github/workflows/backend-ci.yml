name: Backend CI

on:
  # test 가 필수 체크라 paths 필터를 두지 않는다 (필터에 걸린 PR은 체크가 생성되지 않아 머지가 막힘)
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# 같은 브랜치에 연속 push 시 이전 실행을 취소한다
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # build.gradle 의 toolchain(Java 25)과 맞춘다
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: backend/build/reports/tests/test
